<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.45" stop-color="#071a34"/>
      <stop offset="1" stop-color="#04111f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082449"/>
      <stop offset="1" stop-color="#020b18"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="12%" cy="28%" r="25%">
      <stop offset="0" stop-color="#7db8ff" stop-opacity="0.45"/>
      <stop offset="0.45" stop-color="#2b79ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="boatGlow" cx="84%" cy="56%" r="20%">
      <stop offset="0" stop-color="#5aa7ff" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#0a4cff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="softBlur">
