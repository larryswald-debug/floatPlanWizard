  <path d="M0 310 C220 295 430 318 620 300 C850 278 1050 318 1260 292 C1420 272 1510 298 1600 286" fill="none" stroke="#3aa7ff" stroke-opacity="0.12" stroke-width="2"/>
  <path d="M0 355 C180 348 360 364 540 350 C740 335 930 360 1135 342 C1320 326 1460 346 1600 334" fill="none" stroke="#8ecbff" stroke-opacity="0.08" stroke-width="2"/>

