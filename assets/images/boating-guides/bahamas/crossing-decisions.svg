<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 500" role="img" aria-labelledby="stream-title stream-desc"><title id="stream-title">Crossing decisions: schematic, not a forecast</title><desc id="stream-desc">A general northward Florida Current arrow between Florida and the Bahamas. Check wind and waves, passage duration and waiting alternatives. This diagram supplies no heading correction, current speed or navigation track.</desc><defs><marker id="arrow" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto"><path d="M0 0L4 2L0 4Z" fill="#388b96"/></marker></defs><rect width="560" height="500" rx="12" fill="#edf6f7"/><g font-family="sans-serif" fill="#173f49"><text x="24" y="36" font-size="24" font-weight="700">Consider the crossing as a whole</text><text x="24" y="76" font-size="20">Schematic only • Not to scale</text><text x="30" y="168" font-size="23">Florida</text><text x="355" y="168" font-size="23">The Bahamas</text><path d="M265 220V140" stroke="#388b96" stroke-width="16" marker-end="url(#arrow)"/><text x="24" y="270" font-size="22">General northward Florida Current flow</text><text x="24" y="302" font-size="20">Position and conditions vary.</text><text x="24" y="350" font-size="22">1. Check current wind and wave forecasts.</text><text x="24" y="386" font-size="22">2. Allow time for the reviewed water path.</text><text x="24" y="422" font-size="22">3. Keep a waiting-day alternative.</text><text x="24" y="470" font-size="20">No course compensation • NOAA / NWS context</text></g></svg>

