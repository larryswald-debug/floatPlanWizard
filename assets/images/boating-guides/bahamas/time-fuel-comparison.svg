<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 620" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">Illustrative time and fuel comparison</title><desc id="chart-desc">Independent speed and consumption assumptions for the same illustrative mileage. Separate time and fuel scales. The HTML worksheet supplies every value and the reserve method.</desc><rect width="560" height="620" fill="#f3f7f5" rx="12"/><text x="24" y="36" font-family="sans-serif" font-size="24" fill="#173f49">120 nm illustration: two operating points</text><text x="24" y="72" font-family="sans-serif" font-size="21" fill="#173f49">20 kn at 18 US gal/h • 7 kn at 4 US gal/h</text><text x="24" y="116" font-family="sans-serif" font-size="23" fill="#173f49">Underway time estimate</text><text x="24" y="162" font-family="sans-serif" font-size="21" fill="#173f49">20 kn</text><rect x="96" y="142" width="112.00000000000001" height="28" rx="3" fill="#0f6775"/><text x="96" y="194" font-family="sans-serif" font-size="20" fill="#173f49">6 h 00 min</text><text x="24" y="234" font-family="sans-serif" font-size="21" fill="#173f49">7 kn</text><rect x="96" y="214" width="320" height="28" rx="3" fill="#0f6775"/><text x="96" y="266" font-family="sans-serif" font-size="20" fill="#173f49">17 h 09 min</text><text x="24" y="318" font-family="sans-serif" font-size="23" fill="#173f49">Fuel estimate with 20% added reserve</text><text x="24" y="364" font-family="sans-serif" font-size="21" fill="#173f49">20 kn</text><rect x="96" y="344" width="320" height="28" rx="3" fill="#a7742f"/><text x="96" y="396" font-family="sans-serif" font-size="20" fill="#173f49">129.6 US gal</text><text x="24" y="436" font-family="sans-serif" font-size="21" fill="#173f49">7 kn</text><rect x="96" y="416" width="203.17460317460316" height="28" rx="3" fill="#a7742f"/><text x="96" y="468" font-family="sans-serif" font-size="20" fill="#173f49">82.3 US gal</text><text x="24" y="525" font-family="sans-serif" font-size="20" fill="#173f49">Separate scales; each burn rate is assumed.</text><text x="24" y="555" font-family="sans-serif" font-size="20" fill="#173f49">Slowing a boat does not promise this saving.</text><text x="24" y="585" font-family="sans-serif" font-size="20" fill="#173f49">Illustrative estimates • No idle/auxiliary burn</text></svg>

